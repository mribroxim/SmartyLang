name: Release checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run locales:audit
      - run: node scripts/audit-ui-source.mjs --strict
      - run: npm run build
      - run: node scripts/check-client-secrets.mjs
      - run: npm audit --omit=dev --audit-level=high
