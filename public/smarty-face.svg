<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -8 162 162">
  <!-- Smarty's face, taken from the "Hi there" sticker (ears, head, eyes, whiskers) with the sticker ink outline. -->
  <defs>
    <filter id="se-ink" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="ink"/>
      <feMorphology in="ink" operator="erode" radius="1.4" result="core0"/>
      <feComponentTransfer in="core0" result="core"><feFuncA type="linear" slope="4" intercept="-2.4"/></feComponentTransfer>
      <feMorphology in="core" operator="dilate" radius="5.9" result="grow"/>
      <feGaussianBlur in="grow" stdDeviation="2.2" result="b"/>
      <feOffset in="b" dy="2.5" result="o"/>
      <feFlood flood-color="#000" flood-opacity=".16"/>
      <feComposite in2="o" operator="in" result="sh"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="grow" operator="in" result="ring"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="ring"/><feMergeNode in="ink"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#se-ink)">
    <g transform="translate(101 80)">
      <path d="M-47 -7 C-50 -26 -50 -48 -45 -71 C-36 -62 -24 -49 -11 -37 C-23 -31 -37 -21 -47 -7 Z" fill="#0b0b0c"/>
      <path d="M49 -7 C52 -25 52 -46 47 -68 C38 -60 26 -48 12 -37 C24 -31 39 -21 49 -7 Z" fill="#0b0b0c"/>
      <path d="M-52 15 C-56 -5 -49 -27 -31 -36 C-19 -42 -9 -43 0 -43 C11 -43 22 -41 32 -35 C49 -26 56 -5 53 15 C51 30 38 40 17 42 C6 43 -6 43 -17 42 C-38 40 -50 30 -52 15 Z" fill="#0b0b0c"/>
      <path d="M-53 17 C-61 14 -68 13 -76 14 M-53 24 C-60 24 -67 26 -74 29 M54 17 C62 14 69 13 77 14 M54 24 C61 24 68 26 75 29" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="-20" cy="7" r="13.5" fill="#0b0b0c" stroke="#ffffff" stroke-width="3.6"/>
      <circle cx="20" cy="7" r="13.5" fill="#0b0b0c" stroke="#ffffff" stroke-width="3.6"/>
    </g>
  </g>
</svg>
